{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block classe_pagina %}estreita{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  <p class="apoio">Use o e-mail cadastrado na instituição para abrir e acompanhar solicitações.</p>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus value="{{ request.form.email }}">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <label class="caixa"><input type="checkbox" name="lembrar" value="1"> Manter conectado neste computador</label>
    <button type="submit" class="botao">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
{% endblock %}
